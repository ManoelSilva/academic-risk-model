version: '3.8'

services:
  api:
    build: .
    ports:
      - "${MODEL_API_PORT:-5000}:${MODEL_API_PORT:-5000}"
    environment:
      - PORT=${MODEL_API_PORT:-5000}
      - LOG_LEVEL=INFO
      - MODEL_PATH=models/production/model.joblib
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    restart: unless-stopped
